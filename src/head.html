<title>שעון נוכחות קינסט</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: full-height phone app. Today screen = canvas illustration behind a centered clock; floating glass tab bar at the bottom. */
:root{
  --k-blue:#06B3E5; --k-navy:#00203F; --k-gray:#E6E9EC; --k-graphite:#2F2F2F; --k-pink:#FA1664;
  --bg:#E6E9EC; --surface:#FFFFFF; --ink:#00203F; --muted:#4D5E73; --ink3:#8592A3;
  --line:rgb(0 32 63 / .11); --sunk:rgb(0 32 63 / .06); --accent-text:#0480AB;
  --glass2:rgb(255 255 255 / .9); --chip:#FFFFFF; --field:#FFFFFF;
  --sel-bg:#00203F; --sel-fg:#FFFFFF; --tabon:#00203F; --tabon-fg:#FFFFFF; --tabon-ic:#06B3E5;
  --ok:#1E7A3F; --ok-bg:rgb(48 194 90 / .14); --amber:#A85F00; --amber-bg:rgb(255 159 10 / .15); --rec:#D80F55; --rec-bg:rgb(250 22 100 / .12);
  --tint:rgb(6 179 229 / .16); --dusk:linear-gradient(180deg,rgb(0 32 63 / .3),rgb(124 92 255 / .1) 55%,rgb(255 150 90 / .18));
  --edge:inset 0 0 0 .5px rgb(255 255 255 / .95),inset 0 1px 0 rgb(255 255 255 / .95);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew","Heebo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#2F2F2F; --surface:#3A3A3A; --ink:#E6E9EC; --muted:#A9B1BC; --ink3:#7E8792;
  --line:rgb(230 233 236 / .11); --sunk:rgb(230 233 236 / .07); --accent-text:#06B3E5;
  --glass2:rgb(70 70 70 / .82); --chip:rgb(255 255 255 / .08); --field:rgb(255 255 255 / .07);
  --sel-bg:#06B3E5; --sel-fg:#00203F; --tabon:#06B3E5; --tabon-fg:#00203F; --tabon-ic:#00203F;
  --ok:#5BE38F; --ok-bg:rgb(48 194 90 / .18); --amber:#FFB340; --amber-bg:rgb(255 159 10 / .18); --rec:#FF4D8A; --rec-bg:rgb(250 22 100 / .2);
  --tint:rgb(6 179 229 / .2); --dusk:linear-gradient(180deg,rgb(0 10 25 / .45),rgb(124 92 255 / .12) 55%,rgb(255 150 90 / .14));
  --edge:inset 0 0 0 .5px rgb(255 255 255 / .12),inset 0 1px 0 rgb(255 255 255 / .08); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2F2F2F; --surface:#3A3A3A; --ink:#E6E9EC; --muted:#A9B1BC; --ink3:#7E8792;
  --line:rgb(230 233 236 / .11); --sunk:rgb(230 233 236 / .07); --accent-text:#06B3E5;
  --glass2:rgb(70 70 70 / .82); --chip:rgb(255 255 255 / .08); --field:rgb(255 255 255 / .07);
  --sel-bg:#06B3E5; --sel-fg:#00203F; --tabon:#06B3E5; --tabon-fg:#00203F; --tabon-ic:#00203F;
  --ok:#5BE38F; --ok-bg:rgb(48 194 90 / .18); --amber:#FFB340; --amber-bg:rgb(255 159 10 / .18); --rec:#FF4D8A; --rec-bg:rgb(250 22 100 / .2);
  --tint:rgb(6 179 229 / .2); --dusk:linear-gradient(180deg,rgb(0 10 25 / .45),rgb(124 92 255 / .12) 55%,rgb(255 150 90 / .14));
  --edge:inset 0 0 0 .5px rgb(255 255 255 / .12),inset 0 1px 0 rgb(255 255 255 / .08); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);direction:rtl;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--k-blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
#cv{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.veil{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 1.1s ease,background 1.4s ease}
.veil.in{background:var(--tint);opacity:1}
.veil.out{background:var(--dusk);opacity:1}
.app{position:relative;z-index:2;max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
header.top{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;height:56px;flex:none}
header.top .hlogo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;height:28px;width:auto;pointer-events:none}
.brand{flex:1;font-size:21px;font-weight:700;letter-spacing:-.02em;text-align:right}
.brand b{color:var(--k-blue);font-weight:700}
.rb{flex:none;width:44px;height:44px;border:0;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:var(--surface);box-shadow:0 4px 14px rgb(0 32 63 / .08);cursor:pointer;padding:0}
:root[data-theme="dark"] .rb{box-shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rb{box-shadow:none}}
.rb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.demo{height:30px;padding:0 12px;border:0;border-radius:999px;background:var(--amber-bg);color:var(--amber);font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
#view{flex:1;display:flex;flex-direction:column;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
/* today */
.mock{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;min-height:calc(100dvh - 56px - 104px - env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px))}
.mock .d{font-size:13px;color:var(--muted);font-weight:500;margin-top:6px}
.mock .q{margin:6px 0 0;font-size:20px;font-weight:700;letter-spacing:-.015em;line-height:1.3;max-width:22ch;text-wrap:balance}
.mock .sp{flex:1}.mock .sp.big{flex:1.9}
.mock .l{font-size:14px;color:var(--muted)}
.mock .t{font-size:68px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;direction:ltr}
.mock .t.wait{color:var(--ink3);font-weight:500}
.mock .t.pair{font-size:46px}
.mock .t .dash{color:var(--ink3);font-weight:500}
.where{all:unset;cursor:pointer;margin-top:10px;display:inline-flex;align-items:center;gap:5px;min-height:28px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--ink3)}
.where svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8}
.where.on{background:var(--sunk);color:var(--ink)}
.where.on svg{stroke:var(--accent-text)}
.locflag{margin-top:6px;font-size:12.5px;font-weight:600;color:var(--amber)}
.slide{position:relative;width:100%;height:60px;border-radius:999px;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:var(--muted);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;margin-bottom:6px}
.slide .lbl{transition:opacity .3s}
.knob{position:absolute;top:5px;right:5px;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;cursor:grab;background:var(--k-blue);box-shadow:0 6px 16px rgb(6 179 229 / .4);transition:background-color .4s,box-shadow .4s}
.knob svg{width:20px;height:20px;fill:none;stroke:#00203F;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.slide.exit .knob{background:var(--k-pink);box-shadow:0 6px 16px rgb(250 22 100 / .35)}
.slide.exit .knob svg{stroke:#fff}
.slide.done{opacity:.55;pointer-events:none}
.slide.done .knob{display:none}
/* pages */
.ph{display:flex;align-items:flex-end;gap:10px;margin:8px 0 14px}
.ph h1{margin:0;flex:1;font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.05}
.ph .sub{font-size:13px;color:var(--muted)}
.hd{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);margin:18px 4px 6px}
.hd::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--k-blue)}
.hd .grow{flex:1}
.list{display:flex;flex-direction:column}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:12px 4px;border:0;background:none;width:100%;text-align:right;cursor:pointer;border-radius:12px}
.row+.row::before{content:"";position:absolute;top:0;right:4px;left:4px;height:.5px;background:var(--line)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t1{font-size:15.5px;font-weight:600}
.row .t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row .tm{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr}
.row.today .t1,.row.today .tm{color:var(--accent-text)}
.row.off .t1{color:var(--ink3)}
.badge{height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;white-space:nowrap}
.badge.vac{background:var(--sunk);color:var(--muted)}
.badge.wait{background:var(--amber-bg);color:var(--amber)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.no{background:var(--rec-bg);color:var(--rec)}
.badge.sick{background:var(--rec-bg);color:var(--rec)}
.badge.out{background:var(--amber-bg);color:var(--amber)}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.av.s{background:linear-gradient(135deg,#2CC6F2,#0784AD)}.av.a{background:linear-gradient(135deg,#A9B1BE,#6E7787)}
.bal{display:flex;gap:28px;padding:0 4px;margin:4px 0 14px}
.bal div{display:flex;flex-direction:column}
.bal b{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.bal span{font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{height:48px;border:0;border-radius:999px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;background:var(--k-blue);color:#00203F;box-shadow:0 6px 16px rgb(6 179 229 / .3)}
.btn.ghost{background:var(--sunk);color:var(--ink);box-shadow:none}
.btn.navy{background:var(--sel-bg);color:var(--sel-fg);box-shadow:none}
.empty{padding:22px 8px;color:var(--muted);text-align:center;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.kpi{padding:10px 12px;border-radius:16px;background:var(--sunk)}
.kpi b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.mnav{display:flex;align-items:center;gap:6px}
.mnav button{width:34px;height:34px;border:0;border-radius:50%;background:var(--sunk);display:grid;place-items:center;cursor:pointer;padding:0}
.mnav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mnav b{min-width:96px;text-align:center;font-size:15px}
.acts{display:flex;gap:8px;flex:none}
.rnd{width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;padding:0}
.rnd svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.rnd.ok{background:var(--ok);color:#fff}.rnd.no{background:var(--sunk);color:var(--ink)}
.empcard{padding:4px 0 12px}
.empcard+.empcard{border-top:.5px solid var(--line);padding-top:14px}
.emph{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.emph b{font-size:17px}
.exp{border:0;background:none;color:var(--accent-text);font-weight:600;font-size:14px;cursor:pointer;padding:6px 4px}
.drow{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;padding:8px 4px;font-size:14px;border-top:.5px solid var(--line)}
.drow .tt{direction:ltr;text-align:left;font-variant-numeric:tabular-nums;font-weight:600}
.drow .nn{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* nav */
nav.tabs{position:fixed;z-index:7;left:0;right:0;margin-inline:auto;max-width:520px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:calc(100% - 28px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));height:64px;padding:5px;display:flex;gap:2px;border-radius:999px;background:var(--glass2);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);box-shadow:var(--edge),0 12px 34px rgb(15 30 60 / .16)}
nav.tabs button{flex:1 1 0;min-width:0;border:0;background:none;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted);cursor:pointer;position:relative}
nav.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{background:var(--tabon);color:var(--tabon-fg);box-shadow:0 6px 16px rgb(0 32 63 / .25)}
nav.tabs button[aria-selected="true"] svg{color:var(--tabon-ic)}
nav.tabs .cnt{position:absolute;top:4px;left:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--k-pink);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
/* popups */
#layer .scrim{position:fixed;inset:0;z-index:20;background:rgb(15 20 30 / .32)}
.pop{position:fixed;z-index:21;width:calc(100% - 32px);max-width:400px;max-height:86vh;overflow:auto;background:var(--surface);border-radius:26px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 60px rgb(0 10 25 / .28)}
.pop p{margin:0;font-size:14px;color:var(--muted);line-height:1.5}
.pop .warn{color:var(--amber);font-weight:600}
.btns{display:flex;flex-direction:column;gap:8px}
.bp{height:46px;border:0;border-radius:999px;background:var(--sel-bg);color:var(--sel-fg);font-weight:700;font-size:15px;cursor:pointer}
.bs{height:44px;border:0;border-radius:999px;background:var(--sunk);color:var(--ink);font-weight:600;cursor:pointer}
.bred{border:0;background:none;color:var(--rec);font-weight:600;cursor:pointer}
.form{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:var(--sunk)}
.fld{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 14px;position:relative}
.fld+.fld::before{content:"";position:absolute;top:0;right:14px;left:0;height:.5px;background:var(--line)}
.fld label{flex:none;width:92px;font-size:13.5px;color:var(--muted)}
.fld input,.fld select{flex:1;min-width:0;min-height:44px;border:0;background:none;font-size:16px;text-align:left;direction:ltr;color:var(--ink)}
.fld select{direction:rtl;text-align:right}
textarea.note{width:100%;min-height:78px;border:0;border-radius:16px;padding:12px 14px;font-size:16px;background:var(--sunk);resize:none}
textarea.note:focus,.fld input:focus{outline:none}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;height:36px;border:0;border-radius:999px;background:none;color:var(--muted);font-size:13.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgb(15 30 60 / .12)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{height:34px;padding:0 12px;border:0;border-radius:999px;background:var(--sunk);color:var(--ink);font-size:13.5px;cursor:pointer}
.lbl2{font-size:12.5px;font-weight:600;color:var(--muted);margin:2px 4px -4px}
.toast{position:fixed;z-index:30;bottom:calc(92px + env(safe-area-inset-bottom,0px));background:#FFF0A6;color:#00203F;font-weight:600;font-size:13.5px;line-height:1.35;border-radius:999px;min-height:38px;padding:8px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 28px rgb(0 10 25 / .22)}
.toast button{border:0;background:none;color:#B4570A;font-weight:800;cursor:pointer;padding:0}
</style>
