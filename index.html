<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>שעון נוכחות קינסט</title>

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="נוכחות">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#E6E9EC" id="tcolor">

<style>
/* Layout: full-height phone app. Today screen = canvas illustration behind a centered clock; floating glass tab bar at the bottom. */
:root{
  --k-blue:#06B3E5; --k-navy:#00203F; --k-gray:#E6E9EC; --k-graphite:#2F2F2F; --k-pink:#FA1664;
  --bg:#E6E9EC; --surface:#FFFFFF; --ink:#00203F; --muted:#4D5E73; --ink3:#8592A3;
  --line:rgb(0 32 63 / .11); --sunk:rgb(0 32 63 / .06); --accent-text:#0480AB;
  --glass2:rgb(255 255 255 / .9); --chip:#FFFFFF; --field:#FFFFFF;
  --sel-bg:#00203F; --sel-fg:#FFFFFF; --tabon:#00203F; --tabon-fg:#FFFFFF; --tabon-ic:#06B3E5;
  --ok:#1E7A3F; --ok-bg:rgb(48 194 90 / .14); --amber:#A85F00; --amber-bg:rgb(255 159 10 / .15); --rec:#D80F55; --rec-bg:rgb(250 22 100 / .12);
  --tint:rgb(6 179 229 / .16); --dusk:linear-gradient(180deg,rgb(0 32 63 / .3),rgb(124 92 255 / .1) 55%,rgb(255 150 90 / .18));
  --edge:inset 0 0 0 .5px rgb(255 255 255 / .95),inset 0 1px 0 rgb(255 255 255 / .95);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew","Heebo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#2F2F2F; --surface:#3A3A3A; --ink:#E6E9EC; --muted:#A9B1BC; --ink3:#7E8792;
  --line:rgb(230 233 236 / .11); --sunk:rgb(230 233 236 / .07); --accent-text:#06B3E5;
  --glass2:rgb(70 70 70 / .82); --chip:rgb(255 255 255 / .08); --field:rgb(255 255 255 / .07);
  --sel-bg:#06B3E5; --sel-fg:#00203F; --tabon:#06B3E5; --tabon-fg:#00203F; --tabon-ic:#00203F;
  --ok:#5BE38F; --ok-bg:rgb(48 194 90 / .18); --amber:#FFB340; --amber-bg:rgb(255 159 10 / .18); --rec:#FF4D8A; --rec-bg:rgb(250 22 100 / .2);
  --tint:rgb(6 179 229 / .2); --dusk:linear-gradient(180deg,rgb(0 10 25 / .45),rgb(124 92 255 / .12) 55%,rgb(255 150 90 / .14));
  --edge:inset 0 0 0 .5px rgb(255 255 255 / .12),inset 0 1px 0 rgb(255 255 255 / .08); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2F2F2F; --surface:#3A3A3A; --ink:#E6E9EC; --muted:#A9B1BC; --ink3:#7E8792;
  --line:rgb(230 233 236 / .11); --sunk:rgb(230 233 236 / .07); --accent-text:#06B3E5;
  --glass2:rgb(70 70 70 / .82); --chip:rgb(255 255 255 / .08); --field:rgb(255 255 255 / .07);
  --sel-bg:#06B3E5; --sel-fg:#00203F; --tabon:#06B3E5; --tabon-fg:#00203F; --tabon-ic:#00203F;
  --ok:#5BE38F; --ok-bg:rgb(48 194 90 / .18); --amber:#FFB340; --amber-bg:rgb(255 159 10 / .18); --rec:#FF4D8A; --rec-bg:rgb(250 22 100 / .2);
  --tint:rgb(6 179 229 / .2); --dusk:linear-gradient(180deg,rgb(0 10 25 / .45),rgb(124 92 255 / .12) 55%,rgb(255 150 90 / .14));
  --edge:inset 0 0 0 .5px rgb(255 255 255 / .12),inset 0 1px 0 rgb(255 255 255 / .08); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);direction:rtl;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--k-blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
#cv{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.veil{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 1.1s ease,background 1.4s ease}
.veil.in{background:var(--tint);opacity:1}
.veil.out{background:var(--dusk);opacity:1}
.app{position:relative;z-index:2;max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
header.top{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;height:56px;flex:none}
header.top .hlogo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;height:28px;width:auto;pointer-events:none}
.brand{flex:1;font-size:21px;font-weight:700;letter-spacing:-.02em;text-align:right}
.brand b{color:var(--k-blue);font-weight:700}
.rb{flex:none;width:44px;height:44px;border:0;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:var(--surface);box-shadow:0 4px 14px rgb(0 32 63 / .08);cursor:pointer;padding:0}
:root[data-theme="dark"] .rb{box-shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rb{box-shadow:none}}
.rb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.demo{height:30px;padding:0 12px;border:0;border-radius:999px;background:var(--amber-bg);color:var(--amber);font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
#view{flex:1;display:flex;flex-direction:column;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
/* today */
.mock{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;min-height:calc(100dvh - 56px - 104px - env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px))}
.mock .d{font-size:13px;color:var(--muted);font-weight:500;margin-top:6px}
.mock .q{margin:6px 0 0;font-size:20px;font-weight:700;letter-spacing:-.015em;line-height:1.3;max-width:22ch;text-wrap:balance}
.mock .sp{flex:1}.mock .sp.big{flex:1.9}
.mock .l{font-size:14px;color:var(--muted)}
.mock .t{font-size:68px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;direction:ltr}
.mock .t.wait{color:var(--ink3);font-weight:500}
.mock .t.pair{font-size:46px}
.mock .t .dash{color:var(--ink3);font-weight:500}
.where{all:unset;cursor:pointer;margin-top:10px;display:inline-flex;align-items:center;gap:5px;min-height:28px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--ink3)}
.where svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8}
.where.on{background:var(--sunk);color:var(--ink)}
.where.on svg{stroke:var(--accent-text)}
.locflag{margin-top:6px;font-size:12.5px;font-weight:600;color:var(--amber)}
.slide{position:relative;width:100%;height:60px;border-radius:999px;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:var(--muted);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;margin-bottom:6px}
.slide .lbl{transition:opacity .3s}
.knob{position:absolute;top:5px;right:5px;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;cursor:grab;background:var(--k-blue);box-shadow:0 6px 16px rgb(6 179 229 / .4);transition:background-color .4s,box-shadow .4s}
.knob svg{width:20px;height:20px;fill:none;stroke:#00203F;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.slide.exit .knob{background:var(--k-pink);box-shadow:0 6px 16px rgb(250 22 100 / .35)}
.slide.exit .knob svg{stroke:#fff}
.slide.done{opacity:.55;pointer-events:none}
.slide.done .knob{display:none}
/* pages */
.ph{display:flex;align-items:flex-end;gap:10px;margin:8px 0 14px}
.ph h1{margin:0;flex:1;font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.05}
.ph .sub{font-size:13px;color:var(--muted)}
.hd{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);margin:18px 4px 6px}
.hd::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--k-blue)}
.hd .grow{flex:1}
.list{display:flex;flex-direction:column}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:12px 4px;border:0;background:none;width:100%;text-align:right;cursor:pointer;border-radius:12px}
.row+.row::before{content:"";position:absolute;top:0;right:4px;left:4px;height:.5px;background:var(--line)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t1{font-size:15.5px;font-weight:600}
.row .t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row .tm{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr}
.row.today .t1,.row.today .tm{color:var(--accent-text)}
.row.off .t1{color:var(--ink3)}
.badge{height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;white-space:nowrap}
.badge.vac{background:var(--sunk);color:var(--muted)}
.badge.wait{background:var(--amber-bg);color:var(--amber)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.no{background:var(--rec-bg);color:var(--rec)}
.badge.sick{background:var(--rec-bg);color:var(--rec)}
.badge.out{background:var(--amber-bg);color:var(--amber)}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.av.s{background:linear-gradient(135deg,#2CC6F2,#0784AD)}.av.a{background:linear-gradient(135deg,#A9B1BE,#6E7787)}
.bal{display:flex;gap:28px;padding:0 4px;margin:4px 0 14px}
.bal div{display:flex;flex-direction:column}
.bal b{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.bal span{font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{height:48px;border:0;border-radius:999px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;background:var(--k-blue);color:#00203F;box-shadow:0 6px 16px rgb(6 179 229 / .3)}
.btn.ghost{background:var(--sunk);color:var(--ink);box-shadow:none}
.btn.navy{background:var(--sel-bg);color:var(--sel-fg);box-shadow:none}
.empty{padding:22px 8px;color:var(--muted);text-align:center;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.kpi{padding:10px 12px;border-radius:16px;background:var(--sunk)}
.kpi b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.mnav{display:flex;align-items:center;gap:6px}
.mnav button{width:34px;height:34px;border:0;border-radius:50%;background:var(--sunk);display:grid;place-items:center;cursor:pointer;padding:0}
.mnav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mnav b{min-width:96px;text-align:center;font-size:15px}
.acts{display:flex;gap:8px;flex:none}
.rnd{width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;padding:0}
.rnd svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.rnd.ok{background:var(--ok);color:#fff}.rnd.no{background:var(--sunk);color:var(--ink)}
.empcard{padding:4px 0 12px}
.empcard+.empcard{border-top:.5px solid var(--line);padding-top:14px}
.emph{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.emph b{font-size:17px}
.exp{border:0;background:none;color:var(--accent-text);font-weight:600;font-size:14px;cursor:pointer;padding:6px 4px}
.drow{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;padding:8px 4px;font-size:14px;border-top:.5px solid var(--line)}
.drow .tt{direction:ltr;text-align:left;font-variant-numeric:tabular-nums;font-weight:600}
.drow .nn{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* nav */
nav.tabs{position:fixed;z-index:7;left:0;right:0;margin-inline:auto;max-width:520px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:calc(100% - 28px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));height:64px;padding:5px;display:flex;gap:2px;border-radius:999px;background:var(--glass2);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);box-shadow:var(--edge),0 12px 34px rgb(15 30 60 / .16)}
nav.tabs button{flex:1 1 0;min-width:0;border:0;background:none;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted);cursor:pointer;position:relative}
nav.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{background:var(--tabon);color:var(--tabon-fg);box-shadow:0 6px 16px rgb(0 32 63 / .25)}
nav.tabs button[aria-selected="true"] svg{color:var(--tabon-ic)}
nav.tabs .cnt{position:absolute;top:4px;left:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--k-pink);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
/* popups */
#layer .scrim{position:fixed;inset:0;z-index:20;background:rgb(15 20 30 / .32)}
.pop{position:fixed;z-index:21;width:calc(100% - 32px);max-width:400px;max-height:86vh;overflow:auto;background:var(--surface);border-radius:26px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 60px rgb(0 10 25 / .28)}
.pop p{margin:0;font-size:14px;color:var(--muted);line-height:1.5}
.pop .warn{color:var(--amber);font-weight:600}
.btns{display:flex;flex-direction:column;gap:8px}
.bp{height:46px;border:0;border-radius:999px;background:var(--sel-bg);color:var(--sel-fg);font-weight:700;font-size:15px;cursor:pointer}
.bs{height:44px;border:0;border-radius:999px;background:var(--sunk);color:var(--ink);font-weight:600;cursor:pointer}
.bred{border:0;background:none;color:var(--rec);font-weight:600;cursor:pointer}
.form{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:var(--sunk)}
.fld{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 14px;position:relative}
.fld+.fld::before{content:"";position:absolute;top:0;right:14px;left:0;height:.5px;background:var(--line)}
.fld label{flex:none;width:92px;font-size:13.5px;color:var(--muted)}
.fld input,.fld select{flex:1;min-width:0;min-height:44px;border:0;background:none;font-size:16px;text-align:left;direction:ltr;color:var(--ink)}
.fld select{direction:rtl;text-align:right}
textarea.note{width:100%;min-height:78px;border:0;border-radius:16px;padding:12px 14px;font-size:16px;background:var(--sunk);resize:none}
textarea.note:focus,.fld input:focus{outline:none}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;height:36px;border:0;border-radius:999px;background:none;color:var(--muted);font-size:13.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgb(15 30 60 / .12)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{height:34px;padding:0 12px;border:0;border-radius:999px;background:var(--sunk);color:var(--ink);font-size:13.5px;cursor:pointer}
.lbl2{font-size:12.5px;font-weight:600;color:var(--muted);margin:2px 4px -4px}
.toast{position:fixed;z-index:30;bottom:calc(92px + env(safe-area-inset-bottom,0px));background:#FFF0A6;color:#00203F;font-weight:600;font-size:13.5px;line-height:1.35;border-radius:999px;min-height:38px;padding:8px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 28px rgb(0 10 25 / .22)}
.toast button{border:0;background:none;color:#B4570A;font-weight:800;cursor:pointer;padding:0}
</style>

<style>
/* ===== iOS motion layer (shared by all Keenest sites) — per Apple motion principles ===== */
:root{--ios-move:cubic-bezier(.22,1,.36,1);--ios-in:cubic-bezier(.4,0,1,1)}
@supports (animation-timing-function:linear(0,1)){:root{
  --ios-move:linear(0,.109,.309,.501,.656,.77,.849,.903,.938,.961,.976,.985,.991,.994,1)}}
html,body{overflow-x:clip}
#view,main{overflow-x:clip}
.pop{left:0!important;right:0!important;top:0!important;bottom:0!important;margin:auto!important;height:fit-content!important;transform:none!important}
.toast{left:0!important;right:0!important;margin-inline:auto!important;width:max-content;max-width:calc(100vw - 32px);transform:none!important}
.pop,.sheet{will-change:transform,opacity}
:is(.wseg,.seg,.dseg,nav.tabs,nav.nav)>:is(button,a){font-weight:600!important}
@media (prefers-reduced-motion:no-preference){
  :where(button,a,.chip,.cell,label.bwr){transition:transform .45s var(--ios-move)}
  :where(button,a,.chip,.cell,label.bwr):active{transform:scale(.97);transition:transform .12s ease-out}
  .row:active,.qc:active,.li:active,.cc1:active,div[data-open]:active{transform:none!important;opacity:1!important}
  :where(.row,div[data-open],.qc,.li,.cc1):not(:has(:is(button,select,input,textarea,a,label):active)):active{background-color:rgb(127 140 160 / .12)!important}
  :is(button,.cell,.chip,.btn,.rbtn,.sbtn,.hpill,.fold,.pchip,.wc,.go,.go2,.bp,.bs,.pen,.who,.imp,.ai,.ch2,.bsm2):active{transform:scale(.97)!important}
  :is(.wseg,.seg,.dseg,nav.tabs,nav.nav)>:is(button,a),:is(.wseg,.seg,.dseg,nav.tabs,nav.nav)>:is(button,a):active{transform:none!important;transition:color .25s!important}
  .scrim{animation:iosFade .35s ease both}
  .sheet,.cx-card,.pop{animation:iosPopIn .45s var(--ios-move) both!important}
  .ios-ghost{pointer-events:none}
  .ios-ghost .scrim,.ios-ghost .cx-scrim{animation:iosFadeOut .26s ease forwards!important}
  .ios-ghost .sheet,.ios-ghost .cx-card,.ios-ghost .pop{animation:iosPopOut .24s var(--ios-in) forwards!important}
  .ios-ghost .menu,.ios-ghost .srt-menu,.ios-ghost .cx-menu{animation:iosMenuOut .2s var(--ios-in) forwards!important}
  .srt-menu,.menu{transform-origin:top left;animation:iosMenu .38s var(--ios-move) both!important}
  .cx-menu{animation:iosMenu .38s var(--ios-move) both!important}
  .toast{animation:iosToast .45s var(--ios-move) both!important}
  .xwrap.ios-open .xpn{animation:iosReveal .42s var(--ios-move) both}
  #view.a-tl>*{animation:iosSlideL .42s var(--ios-move) both!important}
  #view.a-tr>*{animation:iosSlideR .42s var(--ios-move) both!important}
  #view.a-load>*{animation:iosRise .5s var(--ios-move) both!important}
  #view.a-flt>*{animation:none!important}
  #view.ios-push>*,main.v-in{animation:iosSlideL .45s var(--ios-move) both!important}
  #view.ios-back>*{animation:iosSlideR .45s var(--ios-move) both!important}
  .ios-thumb{position:absolute;z-index:0;pointer-events:none;will-change:transform,width}
  .ios-flip{position:relative;z-index:1;transition:none!important}
  .ios-flip.ios-flip-on{background:transparent!important;box-shadow:none!important}
}
@media (prefers-reduced-motion:reduce){
  .scrim,.sheet,.pop,.menu,.srt-menu,.toast,main.v-in{animation:iosFade .2s ease both!important}
}
@keyframes iosFade{from{opacity:0}}
@keyframes iosFadeOut{to{opacity:0}}
@keyframes iosPopIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes iosPopOut{to{opacity:0;transform:scale(.96)}}
@keyframes iosMenu{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes iosMenuOut{to{opacity:0;transform:scale(.92)}}
@keyframes iosToast{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes iosReveal{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}

@keyframes iosSlideR{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}

<script>/* ================= effects engine ================= */
(function(){

function isDark(){var t=document.documentElement.getAttribute("data-theme");return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches}

/* ---------- particles ---------- */
var P=[],S={};
function part(o){var p={x:0,y:0,vx:0,vy:0,g:0,drag:1,tv:0,life:0,max:4,size:6,col:"#fff",shape:"dot",rot:0,vr:0,flip:0,vf:0,sway:0,sw:R()*TAU,swf:.05,a:1,fade:1,fin:0,trail:0,tr:null,glow:0,kill:1};
  for(var k in o)p[k]=o[k];if(p.trail)p.tr=[];P.push(p);return p}
function step(p,dt){
  p.vy+=p.g*dt;if(p.drag!==1){var d=Math.pow(p.drag,dt);p.vx*=d;p.vy*=d}
  if(p.tv&&p.vy>p.tv)p.vy=p.tv;
  if(p.sway){p.sw+=p.swf*dt;p.vx+=Math.sin(p.sw)*p.sway*dt}
  if(p.tr){p.tr.push(p.x,p.y);if(p.tr.length>p.trail*2)p.tr.splice(0,2)}
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.flip+=p.vf*dt;p.life+=dt/60;
  if(p.upd)p.upd(p,dt);
}
function alphaOf(p){var a=p.a;if(p.fade)a*=Math.max(0,1-Math.pow(p.life/p.max,p.fade===2?3:1.4));if(p.fin)a*=Math.min(1,p.life/p.fin);return a}
var shapes={
  dot:function(p,s){x.beginPath();x.arc(0,0,s,0,TAU);x.fill()},
  rect:function(p,s){x.fillRect(-s*.6,-s,s*1.2,s*2)},
  sq:function(p,s){x.fillRect(-s,-s,s*2,s*2)},
  rib:function(p,s){x.lineWidth=s*.55;x.lineCap="round";x.beginPath();x.moveTo(-s*1.8,0);x.bezierCurveTo(-s*.7,-s*1.3,s*.7,s*1.3,s*1.8,0);x.stroke()},

  star4:function(p,s){x.beginPath();for(var i=0;i<8;i++){var r=i%2?s*.26:s,a=i*PI/4;x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}x.closePath();x.fill()},
  star5:function(p,s){x.beginPath();for(var i=0;i<10;i++){var r=i%2?s*.45:s,a=i*PI/5-PI/2;x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}x.closePath();x.fill()},
  heart:function(p,s){x.beginPath();x.moveTo(0,s*.35);x.bezierCurveTo(-s*1.2,-s*.4,-s*.5,-s*1.2,0,-s*.5);x.bezierCurveTo(s*.5,-s*1.2,s*1.2,-s*.4,0,s*.35);x.fill()},
  flake:function(p,s){x.lineWidth=Math.max(1,s*.13);x.lineCap="round";x.beginPath();for(var i=0;i<6;i++){var a=i*PI/3,c=Math.cos(a),n=Math.sin(a);x.moveTo(0,0);x.lineTo(c*s,n*s);
    var bx=c*s*.55,by=n*s*.55;x.moveTo(bx,by);x.lineTo(bx+Math.cos(a+.7)*s*.3,by+Math.sin(a+.7)*s*.3);x.moveTo(bx,by);x.lineTo(bx+Math.cos(a-.7)*s*.3,by+Math.sin(a-.7)*s*.3)}x.stroke()},
  leaf:function(p,s){x.beginPath();x.moveTo(0,-s);x.quadraticCurveTo(s*.8,-s*.2,0,s);x.quadraticCurveTo(-s*.8,-s*.2,0,-s);x.fill();x.strokeStyle="rgba(0,0,0,.2)";x.lineWidth=1;x.beginPath();x.moveTo(0,-s);x.lineTo(0,s);x.stroke()},
  petal:function(p,s){x.beginPath();x.moveTo(0,-s);x.bezierCurveTo(s*.9,-s*.6,s*.6,s*.7,0,s);x.bezierCurveTo(-s*.6,s*.7,-s*.9,-s*.6,0,-s);x.fill()},

  sqo:function(p,s){x.lineWidth=2;x.strokeRect(-s,-s,s*2,s*2)},

  coin:function(p,s){var g=x.createLinearGradient(-s,-s,s,s);g.addColorStop(0,"#FFF1B0");g.addColorStop(.5,"#F2C14B");g.addColorStop(1,"#B98420");x.fillStyle=g;x.beginPath();x.arc(0,0,s,0,TAU);x.fill();
    x.strokeStyle="rgba(140,90,10,.5)";x.lineWidth=1.5;x.beginPath();x.arc(0,0,s*.72,0,TAU);x.stroke();x.fillStyle="rgba(140,90,10,.55)";x.font="700 "+(s*1.1)+"px "+getComputedStyle(document.body).fontFamily;x.textAlign="center";x.textBaseline="middle";x.fillText("₪",0,1)},
  bubble:function(p,s){var g=x.createRadialGradient(-s*.3,-s*.3,s*.1,0,0,s);g.addColorStop(0,"rgba(255,255,255,.05)");g.addColorStop(.8,"rgba(160,220,255,.12)");g.addColorStop(1,"rgba(255,255,255,.55)");x.fillStyle=g;x.beginPath();x.arc(0,0,s,0,TAU);x.fill();
    x.strokeStyle="rgba(255,255,255,.7)";x.lineWidth=1.2;x.stroke();var h=x.createLinearGradient(-s,0,s,0);h.addColorStop(0,"rgba(255,120,200,.35)");h.addColorStop(.5,"rgba(120,220,255,.35)");h.addColorStop(1,"rgba(255,240,120,.35)");x.strokeStyle=h;x.lineWidth=2;x.beginPath();x.arc(0,0,s*.92,PI*.1,PI*.9);x.stroke();
    x.fillStyle="rgba(255,255,255,.9)";x.beginPath();x.ellipse(-s*.38,-s*.42,s*.16,s*.09,-.7,0,TAU);x.fill()},
  balloon:function(p,s){x.strokeStyle="rgba(120,130,150,.6)";x.lineWidth=1;x.beginPath();x.moveTo(0,s*1.25);for(var i=1;i<6;i++)x.lineTo(Math.sin(i+p.sw*2)*3,s*1.25+i*s*.45);x.stroke();

function shade(hex,amt){var n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;function f(c){return Math.max(0,Math.min(255,Math.round(amt<0?c*(1+amt):c+(255-c)*amt)))}return"rgb("+f(r)+","+f(g)+","+f(b)+")"}
function drawP(p){var a=alphaOf(p);if(a<=0.003)return;
  if(p.tr&&p.tr.length>3){x.save();x.globalCompositeOperation=S.add;x.strokeStyle=p.col;x.lineCap="round";
    for(var i=2;i<p.tr.length;i+=2){x.globalAlpha=a*(i/p.tr.length)*.8;x.lineWidth=Math.max(.6,p.size*(i/p.tr.length)*(p.tw||1));x.beginPath();x.moveTo(p.tr[i-2],p.tr[i-1]);x.lineTo(p.tr[i],p.tr[i+1]);x.stroke()}
    x.globalAlpha=a*.8;x.beginPath();x.moveTo(p.tr[p.tr.length-2],p.tr[p.tr.length-1]);x.lineTo(p.x,p.y);x.stroke();x.restore()}
  x.save();x.globalAlpha=a;if(p.glow)x.globalCompositeOperation=S.add;x.translate(p.x,p.y);if(p.rot)x.rotate(p.rot);
  if(p.vf){var c=Math.cos(p.flip);x.scale(1,c);if(c<0)x.globalAlpha=a*.72}
  if(p.glow){var gs=p.size*p.glow,g=x.createRadialGradient(0,0,0,0,0,gs);g.addColorStop(0,p.col);g.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=g;x.globalAlpha=a*.35;x.beginPath();x.arc(0,0,gs,0,TAU);x.fill();x.globalAlpha=a}
  x.fillStyle=p.col;x.strokeStyle=p.col;var tw=p.twk?(.55+.45*Math.abs(Math.sin(p.life*p.twk+p.sw))):1;
  (shapes[p.shape]||shapes.dot)(p,p.size*tw);x.restore()}

function O(){return{x:W-31,y:H-46}}           // the slider knob (bottom-left in this layout)
function confettiPiece(px,py,vx,vy,pal,shp){return part({x:px,y:py,vx:vx,vy:vy,g:.28,drag:.982,tv:3,size:rnd(4,7),col:pick(pal),shape:shp||pick(["rect","rect","rect","rib","dot"]),rot:rnd(0,TAU),vr:rnd(-.2,.2),flip:rnd(0,TAU),vf:rnd(.08,.25),sway:.06,swf:.05,max:9,fade:2})}
function cannon(px,py,ang,spd,n,spread,pal,shp){for(var i=0;i<n;i++){var a=ang+(R()-.5)*spread,s=spd*rnd(.5,1.15);confettiPiece(px,py,Math.cos(a)*s,Math.sin(a)*s,pal,shp)}}
function rainOf(n,pal,shp,o){for(var i=0;i<n;i++){var p=confettiPiece(rnd(0,W),rnd(-H*.9,-10),rnd(-.6,.6),rnd(.5,2),pal,shp);if(o)for(var k in o)p[k]=o[k]}}
function burst(px,py,n,spd,pal,o){for(var i=0;i<n;i++){var a=i/n*TAU+rnd(-.05,.05),s=spd*(o&&o.even?1:rnd(.55,1.1));var p=part({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.05,drag:.965,size:rnd(1.4,2.4),col:pick(pal),max:rnd(1.6,2.4),fade:1,trail:6,glow:3});if(o)for(var k in o)p[k]=o[k]}}
function rocket(px,ty,pal,boom,delay){setLater(delay||0,function(){var p=part({x:px,y:H+10,vx:rnd(-.6,.6),vy:-Math.sqrt(2*.12*(H+10-ty)),g:.12,size:2,col:"#FFE7A3",trail:10,glow:3,max:5,fade:0});
  p.upd=function(q){if(q.vy>=-.4&&!q.done){q.done=1;q.max=0;boom(q.x,q.y,pal)}}})}
var later=[];function setLater(ms,fn){later.push({t:S.e*1000+ms,fn:fn})}
function bg(fn){S.bgs.push(fn)}
function fg(fn){S.fgs.push(fn)}
function sparkle(n,pal,o){for(var i=0;i<n;i++){var p=part({x:rnd(10,W-10),y:rnd(10,H-60),size:rnd(3,8),col:pick(pal),shape:"star4",twk:rnd(3,7),max:rnd(3,6),fin:rnd(.1,1.5),fade:1,glow:2.2});if(o)for(var k in o)p[k]=o[k]}}
function txtPoints(str,fs,cx,cy,step){var c=document.createElement("canvas"),w=Math.ceil(W),h=Math.ceil(fs*1.6);c.width=w;c.height=h;var g=c.getContext("2d");g.fillStyle="#000";g.font="800 "+fs+"px "+getComputedStyle(document.body).fontFamily;g.textAlign="center";g.textBaseline="middle";g.direction="rtl";g.fillText(str,w/2,h/2);
  var d=g.getImageData(0,0,w,h).data,pts=[];for(var yy=0;yy<h;yy+=step)for(var xx=0;xx<w;xx+=step)if(d[(yy*w+xx)*4+3]>128)pts.push([xx-w/2+cx,yy-h/2+cy]);return pts}
function textParticles(str,pal,fs,o){var pts=txtPoints(str,fs||Math.min(64,W/5),W/2,H*.34,4);pts.forEach(function(t,i){var a=rnd(0,TAU),d=rnd(H*.4,H);
  var p=part({x:W/2+Math.cos(a)*d,y:H*.34+Math.sin(a)*d,size:rnd(1.3,2.2),col:pick(pal),max:7,fade:0,glow:2.5,tx:t[0],ty:t[1],dl:rnd(0,.5)});

function holidayOf(d){var h=heb(d),m=h.m,x=h.d,g=iso(d),md=g.slice(5);
  if((m==="Elul"&&x===29)||(m==="Tishri"&&x<=2))return "rosh";

  if(m==="Tishri"&&x>=14&&x<=21)return "sukkot";
  if(m==="Tishri"&&x===22)return "simchat";

  if((m==="Adar"||m==="Adar II")&&x===14)return "purim";
  if(m==="Nisan"&&x>=14&&x<=21)return "pesach";
  if(m==="Nisan"&&x===22)return "mimouna";
  if(m==="Nisan"&&x===27)return "shoah";
  if(m==="Iyar"&&x===4)return "zikaron";
  if(m==="Iyar"&&x===5)return "atzmaut";
  if(m==="Iyar"&&x===18)return "lagbaomer";
  if(m==="Iyar"&&x===28)return "yerushalayim";
  if(m==="Sivan"&&(x===5||x===6))return "shavuot";
  if(m==="Av"&&x===9)return "tishabeav";
  if(m==="Av"&&x===15)return "tubeav";
  if(md==="01-01")return "newyear";
  return null}
function hanNight(d){for(var i=0;i<10;i++){var h=heb(addDays(d,-i));if(h.m==="Kislev"&&h.d===24)return i+1}return 0}
function specialOf(d){var g=iso(d),md=g.slice(5),y=d.getFullYear();

function personalOf(d,e){if(!e)return null;var g=iso(d),md=g.slice(5);

  if(k&&SPEC[k]){var s=SPEC[k],q=s.q;if(e)q=q.replace("{name}",e.name);if(k==="birthday"&&extra.name)q=s.q.replace("{name}",extra.name);

/* report: hours bars against the month's target (Sun–Thu, minus holidays, 9 hours a day) */
var DAY_H=9;
function closedDay(d){var h=heb(d),m=h.m,x=h.d;
  return (m==="Tishri"&&(x===1||x===2||x===10||x===15||x===22))||(m==="Nisan"&&(x===15||x===21))||(m==="Sivan"&&x===6)||(m==="Iyar"&&x===5)}
function targetDays(e,y,m,upto){var n=0,d=new Date(y,m,1,12),end=new Date(y,m+1,0,12);if(upto&&upto<end)end=upto;
  while(d<=end){var g=iso(d);if(isWork(d)&&!closedDay(d)&&!(e.start&&g<e.start))n++;d=addDays(d,1)}return n}
function hhmm(min){return Math.floor(min/60)+":"+pad(Math.round(min%60))}
function viewReport(){var now=new Date();if(!repMonth)repMonth=[now.getFullYear(),now.getMonth()];var y=repMonth[0],m=repMonth[1],pre=y+"-"+pad(m+1),cur=(y===now.getFullYear()&&m===now.getMonth());
  var rows=D.emps.map(function(e){var ps=D.punches.filter(function(p){return p.emp===e.id&&p.date.slice(0,7)===pre&&p.out}).sort(function(a,b){return a.date<b.date?-1:1});
    var mn=ps.reduce(function(s,p){return s+Math.max(0,mins(p.out)-mins(p.in))},0);
    function cnt(t){return D.reqs.filter(function(r){return r.emp===e.id&&r.type===t&&(t==="sick"||r.status==="ok")}).reduce(function(s,r){var n=0,d=parse(r.from),z=parse(r.to);while(d<=z){if(iso(d).slice(0,7)===pre&&isWork(d)&&!closedDay(d))n++;d=addDays(d,1)}return s+n},0)}
    var vac=cnt("vac"),sick=cnt("sick"),tgt=targetDays(e,y,m)*DAY_H*60,now2=cur?targetDays(e,y,m,now)*DAY_H*60:tgt,off=(vac+sick)*DAY_H*60;
    return {e:e,ps:ps,mn:mn,vac:vac,sick:sick,tgt:tgt,now:now2,off:off}});
  var tot=rows.reduce(function(s,r){return s+r.mn},0);
  function pct(v,t){return t?Math.min(100,v/t*100):0}
  return '<div class="rp"><div class="rp-m"><button type="button" id="mPrev" aria-label="החודש הקודם"><svg><use href="#i-prev"/></svg></button><div class="rp-mt"><b>'+HEB_MONTHS[m]+" "+y+'</b><span>'+hhmm(tot)+' שעות '+(cur?"עד היום":"בחודש")+'</span></div><button type="button" id="mNext" aria-label="החודש הבא"><svg><use href="#i-next"/></svg></button></div>'+
    rows.map(function(r){var w=pct(r.mn,r.tgt),o=Math.min(100-w,pct(r.off,r.tgt)),mk=cur?pct(r.now,r.tgt):0;
      return '<div class="rp-p"><button type="button" class="rp-t" data-exp="'+r.e.id+'"><i class="pd '+r.e.cls+'"></i><b>'+esc(r.e.name)+'</b><span class="rp-s"><span><b>'+r.ps.length+'</b> ימים</span><span><b>'+r.vac+'</b> חופשה</span><span><b>'+r.sick+'</b> מחלה</span></span><span class="ltr rp-h">'+hhmm(r.mn)+'<i> / '+Math.round(r.tgt/60)+"</i></span></button>"+
        '<div class="rp-bar"><i style="width:'+w+'%"></i><i class="v" style="width:'+o+'%"></i>'+(cur&&mk<100?'<em style="right:'+mk+'%"></em>':"")+"</div>"+
        '<div hidden id="x'+r.e.id+'">'+(r.ps.length?r.ps.map(function(p){return '<div class="drow"><span>'+HEB_DAYS[parse(p.date).getDay()].slice(0,1)+"׳ "+parse(p.date).getDate()+'</span><span class="nn">'+esc(p.note||(p.inLoc==="out"?"מחוץ למשרד":""))+'</span><span class="tt">'+p.in+"–"+p.out+" · "+dur(mins(p.out)-mins(p.in))+"</span></div>"}).join(""):'<p class="sub">אין ימים בחודש הזה</p>')+"</div></div>"}).join("")+
    '<div class="rp-key"><span><i></i>שעות</span><span><i class="v"></i>חופשה ומחלה</span>'+(cur?'<span><i class="m"></i>היעד</span>':"")+'</div><p class="rp-note">היעד מחושב לפי '+DAY_H+' שעות עבודה ביום</p>'+
    '<button class="btn navy" type="button" id="xls" style="width:100%;margin-top:10px">ייצוא לאקסל</button></div>'}

/* ================= sunrise slider: night navy → violet → pink → Keenest blue (and back at exit) ================= */
APP_VERSION=27;
var RAMP_IN=[[0,[0,32,63]],[.3,[72,30,120]],[.55,[250,22,100]],[.78,[123,92,255]],[1,[6,179,229]]];
var RAMP_OUT=[[0,[6,179,229]],[.25,[123,92,255]],[.5,[250,22,100]],[.75,[72,30,120]],[1,[0,32,63]]];
function rampAt(st,t){t=Math.max(0,Math.min(1,t));for(var i=1;i<st.length;i++){if(t<=st[i][0]){var a=st[i-1],b=st[i],u=(t-a[0])/(b[0]-a[0]);u=u*u*(3-2*u);return a[1].map(function(v,j){return Math.round(v+(b[1][j]-v)*u)})}}return st[st.length-1][1]}
var _viewToday=viewToday;
viewToday=function(){var h=_viewToday();window.__rise=0;
  return h.replace('<span class="knob" id="knob"><svg><use href="#i-arrow"/></svg></span>','<span class="sky" id="sky"></span><span class="knob" id="knob"><svg class="k1"><use href="#i-moon"/></svg><svg class="k2"><use href="#i-sun"/></svg></span>')};
function bindSlide(){var slide=$("#slide"),knob=$("#knob"),lbl=$("#slbl"),sky=$("#sky");if(!slide||slide.classList.contains("done"))return;
  var exit=slide.classList.contains("exit"),drag=null,R=exit?RAMP_OUT:RAMP_IN,dir=exit?1:-1;
  if(exit){knob.querySelector(".k1").innerHTML='<use href="#i-sun"/>';knob.querySelector(".k2").innerHTML='<use href="#i-moon"/>'}
  function max(){return slide.clientWidth-knob.offsetWidth-10}
  /* the knob follows the finger; the colors follow the knob with a soft lag, so fast moves still blend slowly */
  var cur=0,target=0,raf=0,last=0,fast=false;
  function colors(p){lbl.style.opacity=String(Math.max(0,1-p*3));lbl.style.color=p>0.02?"rgb(255 255 255 / .85)":"";
    var c=rampAt(R,p),c2=rampAt(R,Math.max(0,p-.28));sky.style.opacity=String(Math.min(1,p*12));sky.style.background="linear-gradient("+(exit?90:270)+"deg,rgb("+c2+") 0%,rgb("+c+") 100%)";
    var q1=Math.max(0,Math.min(1,(.54-p)/.14)),q2=Math.max(0,Math.min(1,(p-.46)/.14));knob.querySelector(".k1").style.opacity=String(q1);knob.querySelector(".k1").style.transform="rotate("+(-p*90)+"deg) scale("+(.7+.3*q1)+")";knob.querySelector(".k2").style.opacity=String(q2);knob.querySelector(".k2").style.transform="rotate("+((1-p)*90)+"deg) scale("+(.7+.3*q2)+")";
    knob.style.setProperty("--kc","rgb("+c+")")}
  function tick(t){var dt=last?Math.min(64,t-last)/1000:0.016;last=t;cur+=(target-cur)*(1-Math.exp(-dt/(fast?0.12:0.28)));if(Math.abs(target-cur)<0.0015)cur=target;colors(cur);if(cur!==target)raf=requestAnimationFrame(tick);else{raf=0;last=0}}
  function paint(d){target=Math.max(0,Math.min(1,d/max()));knob.style.transform="translateX("+(dir*d)+"px)";if(!raf)raf=requestAnimationFrame(tick)}
  colors(0);knob.style.transform="translateX(0px)";
  knob.onpointerdown=function(e){if(busy)return;if(!window.__posP)window.__posP=getPos();drag={x:e.clientX,d:0};knob.setPointerCapture(e.pointerId);knob.style.transition="none";sky.style.transition="none"};
  knob.onpointermove=function(e){if(!drag)return;drag.d=Math.max(0,Math.min(max(),(e.clientX-drag.x)*dir));paint(drag.d)};
  function settle(to,cb){var from=Math.abs(parseFloat((knob.style.transform.match(/-?[\d.]+/)||[0])[0]))||0,t0=performance.now(),dur=Math.max(200,(to>0?560:750)*Math.abs(to-from)/Math.max(1,max()));
    (function step(){var u=Math.min(1,(performance.now()-t0)/dur),e2=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;paint(from+(to-from)*e2);if(u<1)requestAnimationFrame(step);else if(cb)cb()})()}
  function finish(){fast=true;if(cur<.9){setTimeout(finish,30);return}if(raf){cancelAnimationFrame(raf);raf=0}cur=target=1;colors(1);knob.style.transform="translateX("+(dir*max())+"px)";var fc=rampAt(R,1);slide.classList.add("arrived");
    sky.style.transition="background .7s cubic-bezier(.32,.72,0,1)";sky.style.background="rgb("+fc+")";
    lbl.style.transition="opacity .35s ease";lbl.style.opacity="0";
    setTimeout(function(){lbl.textContent=partOfDay();lbl.style.color="#fff";lbl.style.opacity="1"},300);
    setTimeout(function(){act()},520)}
  function end(){if(!drag)return;var ok=drag.d>max()*.8;drag=null;if(ok)settle(max(),finish);else settle(0)}
  knob.onpointerup=end;knob.onpointercancel=end;
  slide.onclick=function(e){if(e.target.closest(".knob")||drag||busy)return;if(!window.__posP)window.__posP=getPos();settle(max(),finish)};
  if(window.__slideIn){window.__slideIn=0;slide.style.opacity="0";requestAnimationFrame(function(){slide.style.transition="opacity .6s cubic-bezier(.32,.72,0,1)";slide.style.opacity="1"})}}
</script>
<script>/* ===== Keenest dialog language — header with title + X, one wide primary button ===== */
(function(){
  const X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const CLOSE=/^\s*(ביטול|סגירה)\s*$/;
  function polish(box,root,close){
    if(!box||box.dataset.kd)return;box.dataset.kd=1;
    if(box.querySelector(".rhd,.bhd")){root.classList.add("kd");return}
    const h=[...box.children].find(c=>c.tagName==="H3");
    root.classList.add("kd");
    const bar=box.querySelector(".actions,.btns");
    const cancel=bar&&[...bar.querySelectorAll("button")].find(b=>CLOSE.test(b.textContent)&&!b.classList.contains("bp"));
    if(bar){if(bar.querySelector(".bp,.btn:not(.ghost):not(.danger)"))bar.classList.add("kd-hasp")}
    if(h){const hd=document.createElement("div");hd.className="kd-hd";const t=document.createElement("div");t.className="kd-t";
      h.replaceWith(hd);t.appendChild(h);const sub=hd.nextElementSibling;if(sub&&sub.matches("p.sub"))t.appendChild(sub);
      const x=document.createElement("button");x.type="button";x.className="kd-x";x.setAttribute("aria-label","סגירה");x.innerHTML=X;
      x.onclick=()=>cancel?cancel.click():close();hd.append(t,x);
      if(cancel){cancel.hidden=true;if(bar&&![...bar.children].some(c=>!c.hidden&&!c.matches(".spacer")))bar.hidden=true}}
  }
  const wrapFn=(name,after)=>{const f=window[name];if(typeof f!=="function"||f.__kd)return;const w=function(){const r=f.apply(this,arguments);try{after(r)}catch(_){}return r};w.__kd=1;window[name]=w};
  wrapFn("openSheet",()=>{const sc=document.querySelector("#sheetHost .scrim");if(sc)polish(sc.querySelector(".sheet"),sc,()=>window.closeSheet())});
  wrapFn("pop",p=>{const el=p&&p.nodeType?p:document.querySelector("#layer .pop");if(el)polish(el,el,()=>window.closePop())});
})();
</script>
<script>/* ===== iOS motion layer (shared by all Keenest sites) ===== */
(function(){
  const RM=matchMedia("(prefers-reduced-motion: reduce)");
  document.addEventListener("touchstart",()=>{},{passive:true});
  const ghost=sel=>{if(RM.matches)return;const h=document.querySelector(sel);if(!h||!h.children.length)return;
    const g=document.createElement("div");g.className="ios-ghost";g.setAttribute("aria-hidden","true");
    [...h.children].forEach(c=>g.appendChild(c.cloneNode(true)));document.body.appendChild(g);setTimeout(()=>g.remove(),300)};
  const wrap=(name,sel)=>{const f=window[name];if(typeof f!=="function"||f.__ios)return;const w=function(){ghost(sel);return f.apply(this,arguments)};w.__ios=1;window[name]=w};
  wrap("closePop","#layer");wrap("closeSheet","#sheetHost");
  const SEG=".wseg,.seg,.dseg,nav.tabs,nav.nav";
  const ACT='[aria-pressed="true"],[aria-selected="true"],[aria-current="page"],.on,.active';
  const EASE=getComputedStyle(document.documentElement).getPropertyValue("--ios-move").trim()||"cubic-bezier(.25,1,.5,1)";
  const last=new Map();
  const box=el=>({x:el.offsetLeft,y:el.offsetTop,w:el.offsetWidth,h:el.offsetHeight});
  function flip(){
    const seen={};
    document.querySelectorAll(SEG).forEach(c=>{
      const base=c.className.replace(/\s*ios-\S+/g,"");const k=base+"#"+(seen[base]=(seen[base]||0)+1);
      const btns=[...c.children].filter(x=>x.matches("button,a"));const a=btns.find(b=>b.matches(ACT));
      if(!a){last.delete(k);return}
      if(getComputedStyle(c).position==="static")c.style.position="relative";
      const now={i:btns.indexOf(a),...box(a)};const p=last.get(k);last.set(k,now);
      if(RM.matches||!p||p.i===now.i)return;
      let from=p;const run=c.querySelector(".ios-thumb");
      if(run){const r=run.getBoundingClientRect(),cr=c.getBoundingClientRect();from={x:r.left-cr.left-c.clientLeft,y:r.top-cr.top-c.clientTop,w:r.width,h:r.height};run.remove()}
      const cs=getComputedStyle(a);if(cs.backgroundColor==="rgba(0, 0, 0, 0)"&&cs.boxShadow==="none")return;
      const t=document.createElement("span");t.className="ios-thumb";
      Object.assign(t.style,{left:now.x+"px",top:now.y+"px",width:now.w+"px",height:now.h+"px",background:cs.backgroundColor,borderRadius:cs.borderRadius,boxShadow:cs.boxShadow});
      btns.forEach(b=>b.classList.add("ios-flip"));a.classList.add("ios-flip-on");c.insertBefore(t,c.firstChild);
      const an=t.animate([{transform:`translate(${from.x-now.x}px,${from.y-now.y}px)`,width:from.w+"px"},{transform:"translate(0,0)",width:now.w+"px"}],{duration:460,easing:EASE});
      an.onfinish=()=>{if(!t.isConnected)return;t.remove();btns.forEach(b=>b.classList.remove("ios-flip","ios-flip-on"))};
    });
  }
  let rowPos=new Map();
  function glide(){
    const v=document.getElementById("view");const busy=v&&/\b(a-tl|a-tr|a-load|ios-push|ios-back)\b/.test(v.className);
    const rows=document.querySelectorAll(".row.trow[data-task],.xwrap,[data-open]");const next=new Map();
    rows.forEach(r=>{const k=r.matches(".xwrap")?"x:"+(r.querySelector("[data-task]")?.dataset.task||""):(r.dataset.task||r.dataset.open);if(!k)return;
      let cur=0;const ga=r.getAnimations().filter(a=>a.id==="glide");
      if(ga.length){cur=parseFloat(getComputedStyle(r).top)||0;ga.forEach(a=>a.cancel())}
      let top=0;for(let e=r;e;e=e.offsetParent)top+=e.offsetTop;next.set(k,top);
      if(busy||RM.matches||r.closest(".xwrap")&&!r.matches(".xwrap"))return;
      const old=rowPos.get(k);if(old===undefined&&!ga.length)return;
      const d=(ga.length?top+cur:old)-top;
      if(Math.abs(d)<1||Math.abs(d)>600)return;
      if(getComputedStyle(r).position==="static")r.style.position="relative";
      const an=r.animate([{top:`${d}px`},{top:"0px"}],{duration:420,easing:EASE});an.id="glide";
    });
    rowPos=next;
  }
  const segScroll=new Map();
  document.addEventListener("scroll",e=>{const c=e.target;if(c&&c.matches&&c.matches(SEG))segScroll.set(c.className.replace(/\s*ios-\S+/g,""),c.scrollLeft)},true);
  function keepSeg(){
    document.querySelectorAll(SEG).forEach(c=>{if(c.scrollWidth<=c.clientWidth+1)return;
      const k=c.className.replace(/\s*ios-\S+/g,"");
      if(!c.__kept){c.__kept=1;if(segScroll.has(k))c.scrollLeft=segScroll.get(k)}
      const a=[...c.children].find(b=>b.matches&&b.matches(ACT));if(!a)return;
      const cr=c.getBoundingClientRect(),ar=a.getBoundingClientRect();let d=0;
      if(ar.left<cr.left+8)d=ar.left-cr.left-8;else if(ar.right>cr.right-8)d=ar.right-cr.right+8;
      if(Math.abs(d)>1)c.scrollBy({left:d,behavior:RM.matches?"auto":"smooth"});
    });
  }
  let openId=null,page;
  function marks(){
    const xw=document.querySelector(".xwrap");const id=xw&&xw.querySelector("[data-task]")?.dataset.task||null;
    if(xw&&id!==openId&&!RM.matches){xw.classList.add("ios-open");setTimeout(()=>xw.classList.remove("ios-open"),500)}openId=id;
    const S_=(typeof S!=="undefined"&&S&&typeof S==="object")?S:null;if(S_){const pv=S_.projView||null;
      if(page!==undefined&&pv!==page&&!RM.matches){const v=document.getElementById("view");if(v){const c=pv?"ios-push":"ios-back";v.classList.remove("ios-push","ios-back");void v.offsetWidth;v.classList.add(c);setTimeout(()=>v.classList.remove(c),520)}}page=pv}
  }
  const run=()=>{try{keepSeg();marks();flip();glide()}catch(_){}};
  new MutationObserver(run).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:["aria-pressed","aria-selected","aria-current"]});
  run();
})();
